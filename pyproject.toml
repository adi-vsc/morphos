[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morphos"
version = "0.0.1"
description = "A physics-driven engine that generates manufacturable geometry by optimizing it toward physical limits."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Adi" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Real electromagnetic backend (FDFD with adjoint gradients).
em = ["ceviche>=0.1.3"]
# Algebraic-multigrid preconditioner for the scalable iterative solve path.
iterative = ["pyamg>=5.0"]
# Mesh extraction for the manufacturing output pipeline (marching cubes).
mfg = ["scikit-image>=0.20"]
# Differentiable-physics backend (JAX port of selected oracles).
diff = ["jax>=0.4"]
dev = ["pytest>=7.0", "pyamg>=5.0", "scikit-image>=0.20", "jax>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
